name: Build Floating Note APK

on:
  push:
    paths:
      - 'FloatingNoteAndroid_buildable_project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip FloatingNoteAndroid_buildable_project.zip -d extracted
          cd extracted/FloatingNoteAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingNote-APK
          path: extracted/FloatingNoteAndroid/app/build/outputs/apk/debug/app-debug.apk
